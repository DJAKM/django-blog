{% extends 'base.html'%}

{% block content %}

<div class="row">
    {% comment %} left sidebar {% endcomment %}
    <div class="col-md-3">
        <div class="nav flex-col nav-pills bg-light" aria-orientation="vertical" >
            <a class="nav-link text-dark" href="{% url 'dashboard' %}">Dashboard</a>
            <a class="nav-link" href="#">Categories</a>
            <a class="nav-link" href="#">Posts</a>
            <a class="nav-link" href="{% url 'logout' %}">Logout</a>
             
        </div>
    </div>



    {% comment %} right content {% endcomment %}
    <div class="col-md-9">
        <div class="row">
            <div class="col">
                <div class="card border-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">
                        All Categories
                    </div>
                    <div class="card-body text-dark">
                        <h5 class="card-title text-center">
                            {{category_count}}
                        </h5>
                    </div>
                </div>

            </div>

            <div class="col">
                <div class="card border-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">
                        All Posts
                    </div>
                    <div class="card-body text-dark">
                        <h5 class="card-title text-center">
                            {{blogs_count}}
                        </h5>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>



{%endblock%}
