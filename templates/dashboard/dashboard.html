{% extends 'base.html'%}

{% block content %}

<div class="row">
    {% comment %} left sidebar {% endcomment %}

    {% include 'dashboard/sidebar.html' %}


    {% comment %} right content {% endcomment %}
    <div class="col-md-9">
        <div class="row">
            <span>
                <h3 class="text-center">Dashboard</h3>
                <h4>Logged in as <b>{{ user.username }}</b></h4>
            </span>
            <div class="col">
                <div class="card border-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">
                        All Categories
                    </div>
                    <div class="card-body text-dark">
                        <h5 class="card-title text-center">
                            {{category_count}}
                        </h5>
                    </div>
                </div>

            </div>

            <div class="col">
                <div class="card border-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">
                        All Posts
                    </div>
                    <div class="card-body text-dark">
                        <h5 class="card-title text-center">
                            {{blogs_count}}
                        </h5>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>



{%endblock%}
